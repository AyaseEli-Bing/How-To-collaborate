<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- App Header / Topbar -->
  <rect width="1200" height="54" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="28" cy="27" r="7" fill="#ff5f56" />
  <circle cx="48" cy="27" r="7" fill="#ffbd2e" />
  <circle cx="68" cy="27" r="7" fill="#27c93f" />
  <text x="100" y="32" fill="#8b949e" font-size="13" font-family="monospace">devboard.local / main — DevBoard Task Management</text>

  <!-- Sidebar -->
  <rect x="0" y="54" width="260" height="696" fill="#161b22" stroke="#30363d" stroke-width="1" />
  
  <!-- Logo -->
  <g transform="translate(24, 78)">
    <rect width="36" height="36" rx="8" fill="#2f81f7" fill-opacity="0.2" stroke="#2f81f7" stroke-width="1.5" />
    <text x="11" y="24" font-size="20" fill="#58a6ff">⚡</text>
    <text x="46" y="24" fill="#f0f6fc" font-size="18" font-weight="700">DevBoard</text>
    <rect x="140" y="8" width="34" height="18" rx="4" fill="#30363d" />
    <text x="145" y="21" fill="#8b949e" font-size="11" font-weight="600">v1.0</text>
  </g>

  <!-- Nav Links -->
  <g transform="translate(20, 140)">
    <text x="10" y="0" fill="#6e7681" font-size="11" font-weight="700" letter-spacing="1">WORKSPACE</text>
    <rect x="0" y="10" width="220" height="38" rx="6" fill="#21262d" />
    <text x="14" y="34" fill="#58a6ff" font-size="14" font-weight="600">📋  Task Board</text>

    <text x="14" y="76" fill="#8b949e" font-size="14">🎯  Workshop Scenarios</text>
    <rect x="190" y="63" width="18" height="18" rx="9" fill="#30363d" />
    <text x="196" y="76" fill="#f0f6fc" font-size="11" font-weight="600">7</text>

    <text x="14" y="116" fill="#8b949e" font-size="14">⌨️  Shortcuts</text>
    <rect x="185" y="103" width="23" height="18" rx="4" fill="#21262d" stroke="#30363d" />
    <text x="193" y="116" fill="#8b949e" font-size="11" font-family="monospace">?</text>
  </g>

  <!-- Git Widget -->
  <g transform="translate(20, 320)">
    <rect width="220" height="140" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="14" y="24" fill="#3fb950" font-size="12" font-weight="700">● GIT ENVIRONMENT</text>
    <text x="14" y="48" fill="#f0f6fc" font-size="13" font-weight="600">Branch: main</text>
    <text x="14" y="70" fill="#8b949e" font-size="11">LocalStorage Engine active</text>
    <text x="14" y="86" fill="#8b949e" font-size="11">Schema resilience: 100%</text>
    <rect x="14" y="100" width="192" height="26" rx="4" fill="#30363d" />
    <text x="56" y="117" fill="#f0f6fc" font-size="11" font-weight="600">↺ Reset Demo Tasks</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(290, 80)">
    <!-- Header -->
    <text x="0" y="28" fill="#f0f6fc" font-size="26" font-weight="700">Project Tasks</text>
    <text x="0" y="52" fill="#8b949e" font-size="14">Manage and track your developer issues, bugs, and learning scenarios.</text>

    <!-- Metrics Cards -->
    <g transform="translate(0, 74)">
      <!-- Total -->
      <rect width="190" height="80" rx="8" fill="#161b22" stroke="#30363d" />
      <text x="16" y="28" fill="#8b949e" font-size="12" font-weight="600">TOTAL TASKS</text>
      <text x="16" y="60" fill="#f0f6fc" font-size="28" font-weight="700">4</text>

      <!-- Pending -->
      <g transform="translate(210, 0)">
        <rect width="190" height="80" rx="8" fill="#161b22" stroke="#30363d" />
        <text x="16" y="28" fill="#d29922" font-size="12" font-weight="600">PENDING</text>
        <text x="16" y="60" fill="#d29922" font-size="28" font-weight="700">2</text>
      </g>

      <!-- Completed -->
      <g transform="translate(420, 0)">
        <rect width="190" height="80" rx="8" fill="#161b22" stroke="#30363d" />
        <text x="16" y="28" fill="#3fb950" font-size="12" font-weight="600">COMPLETED</text>
        <text x="16" y="60" fill="#3fb950" font-size="28" font-weight="700">2</text>
      </g>

      <!-- Progress -->
      <g transform="translate(630, 0)">
        <rect width="250" height="80" rx="8" fill="#161b22" stroke="#30363d" />
        <text x="16" y="28" fill="#8b949e" font-size="12" font-weight="600">PROGRESS</text>
        <text x="16" y="56" fill="#58a6ff" font-size="22" font-weight="700">50%</text>
        <rect x="80" y="42" width="150" height="10" rx="5" fill="#21262d" />
        <rect x="80" y="42" width="75" height="10" rx="5" fill="#2ea043" />
      </g>
    </g>

    <!-- Toolbar: Filters + Search + New Button -->
    <g transform="translate(0, 175)">
      <!-- Filters -->
      <rect width="84" height="36" rx="6" fill="#21262d" stroke="#58a6ff" />
      <text x="24" y="22" fill="#58a6ff" font-size="13" font-weight="600">All (4)</text>

      <rect x="94" width="100" height="36" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="108" y="22" fill="#8b949e" font-size="13">Pending (2)</text>

      <rect x="204" width="115" height="36" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="216" y="22" fill="#8b949e" font-size="13">Completed (2)</text>

      <!-- Search Input -->
      <rect x="360" width="340" height="36" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="380" y="22" fill="#6e7681" font-size="13">🔍  Search tasks...</text>
      <rect x="670" y="8" width="20" height="20" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="678" y="22" fill="#8b949e" font-size="11" font-family="monospace">/</text>

      <!-- New Task Button -->
      <rect x="730" width="150" height="36" rx="6" fill="#238636" />
      <text x="754" y="23" fill="#ffffff" font-size="13" font-weight="600">+ New Task</text>
      <rect x="846" y="8" width="20" height="20" rx="4" fill="#2ea043" />
      <text x="852" y="22" fill="#ffffff" font-size="11" font-family="monospace">N</text>
    </g>

    <!-- Task List -->
    <g transform="translate(0, 235)">
      <!-- Task 1 -->
      <g transform="translate(0, 0)">
        <rect width="880" height="82" rx="8" fill="#161b22" stroke="#30363d" filter="url(#cardShadow)" />
        <rect x="18" y="30" width="22" height="22" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" />
        <rect x="54" y="18" width="70" height="20" rx="4" fill="#1f3b58" />
        <text x="66" y="32" fill="#58a6ff" font-size="11" font-weight="700">FEATURE</text>
        <text x="136" y="33" fill="#f0f6fc" font-size="15" font-weight="600">Dark / Light theme toggle with system preference detection</text>
        <text x="54" y="60" fill="#8b949e" font-size="12">Support automatic OS color scheme sync and persistent localStorage preference.</text>
        <text x="760" y="47" fill="#8b949e" font-size="13">✏️ Edit  🗑️ Delete</text>
      </g>

      <!-- Task 2 -->
      <g transform="translate(0, 96)">
        <rect width="880" height="82" rx="8" fill="#161b22" stroke="#30363d" filter="url(#cardShadow)" />
        <rect x="18" y="30" width="22" height="22" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" />
        <rect x="54" y="18" width="50" height="20" rx="4" fill="#4d1d22" />
        <text x="65" y="32" fill="#ff7b72" font-size="11" font-weight="700">BUG</text>
        <text x="116" y="33" fill="#f0f6fc" font-size="15" font-weight="600">Prevent whitespace-only submissions in task creation</text>
        <text x="54" y="60" fill="#8b949e" font-size="12">Reject submissions with only whitespace characters and show clear inline error feedback.</text>
        <text x="760" y="47" fill="#8b949e" font-size="13">✏️ Edit  🗑️ Delete</text>
      </g>

      <!-- Task 3 -->
      <g transform="translate(0, 192)">
        <rect width="880" height="82" rx="8" fill="#161b22" stroke="#21262d" opacity="0.85" />
        <rect x="18" y="30" width="22" height="22" rx="4" fill="#2ea043" />
        <text x="23" y="46" fill="#ffffff" font-size="14" font-weight="700">✓</text>
        <rect x="54" y="18" width="112" height="20" rx="4" fill="#1e3a2b" />
        <text x="62" y="32" fill="#3fb950" font-size="11" font-weight="700">DOCUMENTATION</text>
        <text x="178" y="33" fill="#8b949e" font-size="15" font-weight="600" text-decoration="line-through">Document Git branching &amp; PR workflow in CONTRIBUTING.md</text>
        <text x="54" y="60" fill="#6e7681" font-size="12">Detailed guide for feature branches, commit rules, and issue references.</text>
        <text x="760" y="47" fill="#8b949e" font-size="13">✏️ Edit  🗑️ Delete</text>
      </g>

      <!-- Task 4 -->
      <g transform="translate(0, 288)">
        <rect width="880" height="82" rx="8" fill="#161b22" stroke="#21262d" opacity="0.85" />
        <rect x="18" y="30" width="22" height="22" rx="4" fill="#2ea043" />
        <text x="23" y="46" fill="#ffffff" font-size="14" font-weight="700">✓</text>
        <rect x="54" y="18" width="56" height="20" rx="4" fill="#38294a" />
        <text x="65" y="32" fill="#d2a8ff" font-size="11" font-weight="700">TASK</text>
        <text x="122" y="33" fill="#8b949e" font-size="15" font-weight="600" text-decoration="line-through">Configure defensive LocalStorage persistence &amp; self-healing schema</text>
        <text x="54" y="60" fill="#6e7681" font-size="12">Sanitize corrupted data without crashing the UI application.</text>
        <text x="760" y="47" fill="#8b949e" font-size="13">✏️ Edit  🗑️ Delete</text>
      </g>
    </g>
  </g>
</svg>