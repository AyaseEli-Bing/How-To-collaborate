<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 780" width="450" height="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Device Frame -->
  <rect width="450" height="780" rx="36" fill="#0d1117" stroke="#30363d" stroke-width="4" />
  
  <!-- Notch / Status Bar -->
  <rect x="140" y="10" width="170" height="24" rx="12" fill="#161b22" />
  <circle cx="280" cy="22" r="4" fill="#0d1117" />
  <text x="36" y="26" fill="#8b949e" font-size="12" font-weight="600">9:41</text>
  <text x="385" y="26" fill="#8b949e" font-size="12">100%</text>

  <!-- App Header -->
  <g transform="translate(24, 48)">
    <text x="0" y="24" fill="#58a6ff" font-size="20">⚡</text>
    <text x="28" y="24" fill="#f0f6fc" font-size="18" font-weight="700">DevBoard</text>
    <rect x="350" y="4" width="48" height="26" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="362" y="21" fill="#8b949e" font-size="12">Menu</text>
  </g>

  <!-- Metrics row (3 cols) -->
  <g transform="translate(24, 96)">
    <rect width="124" height="64" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="12" y="22" fill="#8b949e" font-size="10" font-weight="600">TOTAL</text>
    <text x="12" y="48" fill="#f0f6fc" font-size="22" font-weight="700">4</text>

    <g transform="translate(138, 0)">
      <rect width="124" height="64" rx="8" fill="#161b22" stroke="#30363d" />
      <text x="12" y="22" fill="#d29922" font-size="10" font-weight="600">PENDING</text>
      <text x="12" y="48" fill="#d29922" font-size="22" font-weight="700">2</text>
    </g>

    <g transform="translate(276, 0)">
      <rect width="124" height="64" rx="8" fill="#161b22" stroke="#30363d" />
      <text x="12" y="22" fill="#3fb950" font-size="10" font-weight="600">DONE</text>
      <text x="12" y="48" fill="#3fb950" font-size="22" font-weight="700">2</text>
    </g>
  </g>

  <!-- Mobile Quick Add -->
  <g transform="translate(24, 180)">
    <rect width="400" height="46" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="16" y="28" fill="#6e7681" font-size="13">What needs to be done?</text>
    <rect x="320" y="6" width="72" height="34" rx="6" fill="#238636" />
    <text x="340" y="27" fill="#ffffff" font-size="13" font-weight="600">+ Add</text>
  </g>

  <!-- Mobile Segmented Filter -->
  <g transform="translate(24, 240)">
    <rect width="400" height="38" rx="8" fill="#161b22" stroke="#30363d" />
    <rect x="4" y="4" width="128" height="30" rx="6" fill="#21262d" stroke="#58a6ff" />
    <text x="44" y="23" fill="#58a6ff" font-size="12" font-weight="600">All (4)</text>

    <text x="165" y="23" fill="#8b949e" font-size="12">Pending (2)</text>
    <text x="290" y="23" fill="#8b949e" font-size="12">Done (2)</text>
  </g>

  <!-- Task Cards Stacked -->
  <g transform="translate(24, 300)">
    <!-- Mobile Card 1 -->
    <rect width="400" height="100" rx="8" fill="#161b22" stroke="#30363d" />
    <rect x="16" y="24" width="22" height="22" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" />
    <rect x="48" y="16" width="60" height="18" rx="4" fill="#1f3b58" />
    <text x="56" y="29" fill="#58a6ff" font-size="10" font-weight="700">FEATURE</text>
    <text x="48" y="52" fill="#f0f6fc" font-size="14" font-weight="600">Dark / Light theme toggle</text>
    <text x="48" y="74" fill="#8b949e" font-size="11">Detect user OS color preference</text>
    <text x="340" y="56" fill="#8b949e" font-size="13">✏️  🗑️</text>

    <!-- Mobile Card 2 -->
    <g transform="translate(0, 114)">
      <rect width="400" height="100" rx="8" fill="#161b22" stroke="#30363d" />
      <rect x="16" y="24" width="22" height="22" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" />
      <rect x="48" y="16" width="44" height="18" rx="4" fill="#4d1d22" />
      <text x="56" y="29" fill="#ff7b72" font-size="10" font-weight="700">BUG</text>
      <text x="48" y="52" fill="#f0f6fc" font-size="14" font-weight="600">Whitespace input validation</text>
      <text x="48" y="74" fill="#8b949e" font-size="11">Inline error for blank titles</text>
      <text x="340" y="56" fill="#8b949e" font-size="13">✏️  🗑️</text>
    </g>

    <!-- Mobile Card 3 (Completed) -->
    <g transform="translate(0, 228)">
      <rect width="400" height="90" rx="8" fill="#161b22" stroke="#21262d" opacity="0.8" />
      <rect x="16" y="24" width="22" height="22" rx="4" fill="#2ea043" />
      <text x="21" y="39" fill="#ffffff" font-size="13" font-weight="700">✓</text>
      <rect x="48" y="16" width="50" height="18" rx="4" fill="#38294a" />
      <text x="56" y="29" fill="#d2a8ff" font-size="10" font-weight="700">TASK</text>
      <text x="48" y="52" fill="#8b949e" font-size="14" font-weight="600" text-decoration="line-through">Defensive LocalStorage</text>
      <text x="48" y="72" fill="#6e7681" font-size="11">Self-healing data schema</text>
      <text x="340" y="52" fill="#8b949e" font-size="13">✏️  🗑️</text>
    </g>
  </g>
</svg>