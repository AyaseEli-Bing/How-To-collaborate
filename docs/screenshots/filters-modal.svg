<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Dimmed background from desktop view -->
  <rect width="1200" height="750" fill="#0d1117" />
  
  <!-- Backdrop Overlay -->
  <rect width="1200" height="750" fill="#000000" fill-opacity="0.65" />

  <!-- Modal Dialog -->
  <g transform="translate(350, 110)">
    <rect width="500" height="530" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    
    <!-- Modal Header -->
    <text x="28" y="42" fill="#f0f6fc" font-size="20" font-weight="700">Edit Task Details</text>
    <rect x="446" y="22" width="26" height="26" rx="6" fill="#21262d" />
    <text x="454" y="40" fill="#8b949e" font-size="16">✕</text>
    <line x1="0" y1="64" x2="500" y2="64" stroke="#30363d" />

    <!-- Form Fields -->
    <!-- Title -->
    <text x="28" y="100" fill="#f0f6fc" font-size="13" font-weight="600">Task Title <tspan fill="#ff7b72">*</tspan></text>
    <rect x="28" y="112" width="444" height="42" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="2" />
    <text x="42" y="138" fill="#f0f6fc" font-size="14">Export tasks to JSON and Markdown format</text>

    <!-- Description -->
    <text x="28" y="185" fill="#f0f6fc" font-size="13" font-weight="600">Description</text>
    <rect x="28" y="196" width="444" height="110" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="42" y="224" fill="#8b949e" font-size="13">Add two export options in the sidebar: JSON backup and Markdown table.</text>
    <text x="42" y="246" fill="#8b949e" font-size="13">Include unit tests for data serialization and sanitize filenames.</text>

    <!-- Label Selection -->
    <text x="28" y="338" fill="#f0f6fc" font-size="13" font-weight="600">Category Label</text>
    <g transform="translate(28, 350)">
      <rect width="80" height="32" rx="16" fill="#1f3b58" stroke="#58a6ff" stroke-width="2" />
      <text x="14" y="21" fill="#58a6ff" font-size="12" font-weight="700">✓ Feature</text>

      <rect x="90" width="60" height="32" rx="16" fill="#21262d" stroke="#30363d" />
      <text x="106" y="21" fill="#8b949e" font-size="12">Bug</text>

      <rect x="160" width="112" height="32" rx="16" fill="#21262d" stroke="#30363d" />
      <text x="174" y="21" fill="#8b949e" font-size="12">Enhancement</text>

      <rect x="282" width="120" height="32" rx="16" fill="#21262d" stroke="#30363d" />
      <text x="294" y="21" fill="#8b949e" font-size="12">Documentation</text>
    </g>

    <!-- Accessibility notice -->
    <text x="28" y="420" fill="#6e7681" font-size="11">Keyboard hint: Press Enter to save, Esc to dismiss.</text>

    <!-- Modal Footer -->
    <line x1="0" y1="446" x2="500" y2="446" stroke="#30363d" />
    <rect x="250" y="466" width="100" height="38" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="282" y="490" fill="#f0f6fc" font-size="13" font-weight="600">Cancel</text>

    <rect x="362" y="466" width="110" height="38" rx="6" fill="#238636" />
    <text x="382" y="490" fill="#ffffff" font-size="13" font-weight="600">Save Task</text>
  </g>
</svg>