<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Backdrop -->
  <rect width="900" height="550" fill="#0d1117" />
  <rect width="900" height="550" fill="#000000" fill-opacity="0.6" />

  <!-- Dialog Window -->
  <g transform="translate(225, 90)">
    <rect width="450" height="360" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    
    <!-- Warning Icon -->
    <circle cx="225" cy="65" r="32" fill="#4d1d22" />
    <text x="213" y="76" fill="#ff7b72" font-size="30">⚠️</text>

    <!-- Dialog Header -->
    <text x="225" y="130" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Delete Task?</text>
    
    <text x="225" y="165" fill="#8b949e" font-size="13" text-anchor="middle">Are you sure you want to permanently remove this task?</text>
    <text x="225" y="185" fill="#8b949e" font-size="13" text-anchor="middle">This action cannot be undone.</text>

    <!-- Target Task Preview Card -->
    <g transform="translate(35, 210)">
      <rect width="380" height="56" rx="6" fill="#0d1117" stroke="#30363d" />
      <rect x="14" y="16" width="46" height="20" rx="4" fill="#4d1d22" />
      <text x="24" y="30" fill="#ff7b72" font-size="10" font-weight="700">BUG</text>
      <text x="70" y="33" fill="#f0f6fc" font-size="13" font-weight="600">Fix whitespace validation bug</text>
    </g>

    <!-- Dialog Actions -->
    <line x1="0" y1="290" x2="450" y2="290" stroke="#30363d" />
    
    <rect x="180" y="308" width="110" height="38" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="216" y="332" fill="#f0f6fc" font-size="13" font-weight="600">Cancel</text>

    <rect x="305" y="308" width="115" height="38" rx="6" fill="#da3633" />
    <text x="323" y="332" fill="#ffffff" font-size="13" font-weight="600">Delete Task</text>
  </g>
</svg>